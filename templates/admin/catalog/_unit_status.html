<span class="badge-status status-{{ status|lower }}">
  {% if status == "Available" %}<i class="bi bi-check-circle me-1"></i>
  {% elif status == "Reserved" %}<i class="bi bi-bookmark me-1"></i>
  {% elif status == "Issued" %}<i class="bi bi-box-arrow-right me-1"></i>
  {% elif status == "Maintenance" %}<i class="bi bi-wrench me-1"></i>
  {% elif status == "Retired" %}<i class="bi bi-slash-circle me-1"></i>
  {% endif %}{{ status }}
</span>
