<div class="pager-bar">
  <div class="pager-icons">
    {% if page_obj.has_previous %}
      <a class="pager-btn"
         href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number }}"
         title="Previous page" aria-label="Previous page">
        <i class="bi bi-chevron-left"></i>
      </a>
    {% else %}
      <span class="pager-btn disabled" aria-disabled="true" aria-label="No previous page">
        <i class="bi bi-chevron-left"></i>
      </span>
    {% endif %}

    {% if page_obj.has_next %}
      <a class="pager-btn"
         href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number }}"
         title="Next page" aria-label="Next page">
        <i class="bi bi-chevron-right"></i>
      </a>
    {% else %}
      <span class="pager-btn disabled" aria-disabled="true" aria-label="No next page">
        <i class="bi bi-chevron-right"></i>
      </span>
    {% endif %}
  </div>
</div>
