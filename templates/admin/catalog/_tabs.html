{% with name=request.resolver_match.url_name %}
<ul class="nav nav-tabs mb-3">
  <li class="nav-item">
    <a class="nav-link {% if 'category' in name %}active{% endif %}" href="{% url 'catalog:category_list' %}">
      <i class="bi bi-folder2 me-1"></i>Categories
      {% if category_total %}<span class="tab-count">{{ category_total }}</span>{% endif %}
    </a>
  </li>
  <li class="nav-item">
    <a class="nav-link {% if 'item' in name %}active{% endif %}" href="{% url 'catalog:item_list' %}">
      <i class="bi bi-journal-text me-1"></i>Catalog Items
      {% if item_total %}<span class="tab-count">{{ item_total }} Items</span>{% endif %}
    </a>
  </li>
</ul>
{% endwith %}
