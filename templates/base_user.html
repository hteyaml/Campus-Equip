{% extends 'base.html' %}

<!-- 1. OVERRIDE THE MESSAGES BLOCK -->
{% block messages %}
    {% if messages %}
        <!-- Hidden HTML to store the messages safely -->
        <div id="django-messages" style="display: none;">
            {% for message in messages %}
                <span class="system-msg" data-text="{{ message }}"></span>
            {% endfor %}
        </div>

        <!-- Pure JavaScript popup for user portal -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const messageElements = document.querySelectorAll('.system-msg');
                messageElements.forEach(function(element) {
                    alert(element.getAttribute('data-text'));
                });
            });
        </script>
    {% endif %}
{% endblock %}

<!-- 2. YOUR NORMAL LAYOUT BLOCK -->
{% block layout %}
<div class="d-flex" id="wrapper" style="min-height: 100vh;">

    <!-- FIXED SIDEBAR -->
    <div class="bg-dark text-white p-3 position-fixed top-0 start-0" style="width: 250px; height: 100vh; overflow-y: auto; z-index: 1040;">
        <h5>Campus Portal</h5>
        <ul class="nav flex-column mt-4">
            <li class="nav-item mb-1">
                <a class="nav-link text-white px-3 py-2 bg-hover-link" href="{% url 'user_portal' %}">
                    <i class="bi bi-columns-gap me-2"></i>Browse Equipments
                </a>
            </li>
            <li class="nav-item mb-1">
                <a class="nav-link text-white px-3 py-2 bg-hover-link" href="{% url 'my_requests' %}">
                    <i class="bi bi-card-list me-2"></i>My Requests
                </a>
            </li>
            <li class="nav-item mb-1">
                <a class="nav-link text-white px-3 py-2 bg-hover-link" href="{% url 'my_profile' %}">
                    <i class="bi bi-person-circle me-2"></i>My Profile
                </a>
            </li>
            <li class="nav-item mb-1 mt-auto">
                <form method="POST" action="{% url 'logout' %}">
                     {% csrf_token %}
                     <button type="submit" class="nav-link text-white px-3 py-2 bg-hover-link w-100 text-start border-0 bg-transparent">
                     <i class="bi bi-box-arrow-right me-2"></i>Logout
                     </button>
                </form>
            </li>
        </ul>
    </div>

    <!-- Container for Student Content (margin-left matching the sidebar width) -->
    <div class="flex-grow-1 p-4 w-100" style="min-height: 100vh; background-color: #f8f9fa; margin-left: 250px;">
        {% block user_content %}
        {% endblock %}
    </div>

</div>
{% endblock %}
