<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Campus Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            color: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 2rem 0;
        }
        .signup-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
        }
        h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: #0F172A; margin-bottom: 0.5rem; }
        .subtitle { color: #64748b; font-size: 0.95rem; margin-bottom: 2rem; }
        .form-label { font-weight: 500; font-size: 0.85rem; color: #0F172A; }
        .form-control { border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.65rem 1rem; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        .form-control:focus { border-color: #38BDF8; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1); }
        .btn-primary-custom { background-color: #1D4ED8; color: #ffffff; border: none; border-radius: 8px; padding: 0.75rem 1rem; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; transition: background-color 0.2s ease; }
        .btn-primary-custom:hover { background-color: #1e3a8a; color: #ffffff; }
        .alert-error { background-color: #fef2f2; color: #991b1b; border: 1px solid #f87171; border-radius: 8px; padding: 0.75rem; font-size: 0.875rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

    <div class="signup-card">
        <div class="text-center mb-4">
            <h2>Create an Account</h2>
            <p class="subtitle">Register to access the Campus Inventory System</p>
        </div>

        <!-- Render Django Backend Error Messages -->
        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'error' %}
                    <div class="alert-error text-center">{{ message }}</div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'signup' %}">
            {% csrf_token %}

            <div class="row g-2 mb-3">
                <div class="col-sm-6">
                    <label for="first_name" class="form-label">First Name</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" required>
                </div>
                <div class="col-sm-6">
                    <label for="last_name" class="form-label">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="contact_number" class="form-label">Contact Number</label>
                <input type="text" id="contact_number" name="contact_number" class="form-control" placeholder="09123456789" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="student@bulsu.edu.ph" required>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" minlength="8" required>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="8" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 mb-3">Sign Up</button>
        </form>

        <div class="text-center mt-2">
            <span class="text-muted" style="font-size: 0.9rem;">Already have an account? </span>
            <a href="{% url 'login' %}" style="color: #1D4ED8; font-weight: 500; text-decoration: none;">Sign in here</a>
        </div>
    </div>

</body>
</html>
